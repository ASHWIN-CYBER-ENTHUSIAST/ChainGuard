name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Write project files
        run: |
          mkdir -p src public scripts
          cat > package.json <<'EOF'
          {
            "name": "chainguard-pro",
            "version": "1.0.0",
            "private": true,
            "type": "module",
            "scripts": { "build": "vite build" },
            "dependencies": {
              "@capacitor-community/bluetooth-le": "^7.0.0",
              "@capacitor/android": "^7.0.0",
              "@capacitor/core": "^7.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.0.0",
              "vite": "^6.0.0"
            }
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.voidx.chainguard",
            "appName": "ChainGuard Pro",
            "webDir": "dist",
            "backgroundColor": "#0d0b1f"
          }
          EOF
          cat > vite.config.js <<'EOF'
          import { defineConfig } from 'vite';
          export default defineConfig({ build: { outDir: 'dist', emptyOutDir: true } });
          EOF
          cat > src/ble-native.js <<'EOF'
          import { Capacitor } from '@capacitor/core';
          import { BleClient } from '@capacitor-community/bluetooth-le';
          const dec = new TextDecoder();
          const enc = new TextEncoder();
          window.NativeBLE = {
            available: Capacitor.isNativePlatform(),
            init: () => BleClient.initialize(),
            pick: (service) => BleClient.requestDevice({ optionalServices: [service] }),
            connect: (deviceId, onDisconnect) => BleClient.connect(deviceId, () => onDisconnect()),
            listen: (deviceId, service, characteristic, cb) =>
              BleClient.startNotifications(deviceId, service, characteristic, (value) => cb(dec.decode(value))),
            write: (deviceId, service, characteristic, text) =>
              BleClient.writeWithoutResponse(deviceId, service, characteristic, new DataView(enc.encode(text + '\n').buffer)),
            disconnect: (deviceId) => BleClient.disconnect(deviceId),
          };
          EOF
          cat > public/manifest.webmanifest <<'EOF'
          {
            "name": "ChainGuard Pro",
            "short_name": "ChainGuard",
            "start_url": ".",
            "display": "standalone",
            "background_color": "#0d0b1f",
            "theme_color": "#7a0f2e"
          }
          EOF
          cat > public/sw.js <<'EOF'
          self.addEventListener('install', () => self.skipWaiting());
          self.addEventListener('activate', (e) => e.waitUntil(self.clients.claim()));
          self.addEventListener('fetch', () => {});
          EOF
          cat > scripts/add-permissions.mjs <<'EOF'
          import fs from 'node:fs';
          const file = 'android/app/src/main/AndroidManifest.xml';
          const lines = [
            '<uses-permission android:name="android.permission.INTERNET" />',
            '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
            '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
            '<uses-permission android:name="android.permission.CAMERA" />',
            '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
            '<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />',
            '<uses-permission android:name="android.permission.VIBRATE" />',
            '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
            '<uses-permission android:name="android.permission.WAKE_LOCK" />',
            '<uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />',
            '<uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />',
            '<uses-permission android:name="android.permission.BLUETOOTH_SCAN" />',
            '<uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />',
            '<uses-feature android:name="android.hardware.bluetooth_le" android:required="true" />',
            '<uses-feature android:name="android.hardware.camera" android:required="false" />',
          ];
          let xml = fs.readFileSync(file, 'utf8');
          const add = lines.filter((l) => !xml.includes(l.match(/android:name="([^"]+)"/)[1]));
          xml = xml.replace('</manifest>', '    ' + add.join('\n    ') + '\n</manifest>');
          fs.writeFileSync(file, xml);
          console.log('Added ' + add.length + ' manifest entries');
          EOF

      - name: Install and build web app
        run: |
          npm install
          npm run build

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android
          node scripts/add-permissions.mjs

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ChainGuardPro-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
